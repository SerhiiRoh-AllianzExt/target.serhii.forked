<div nxLayout="grid maxwidth">
  <div nxRow>
    <div nxCol="8">
      @if (quoteData()?.beitrag?.einmalbeitrag || quoteData()?.leistungsmerkmale?.garantierteMindestrente) {
      <div class="nx-margin-top-xs">
        <div class="nx-margin-bottom-s">
          <span>
            <strong class="nx-margin-right-2xs">Einmalbeitrag:</strong>
            {{
              quoteData()?.beitrag?.einmalbeitrag | currency : 'EUR'
            }}
          </span>
          <span>
            <strong class="nx-margin-right-2xs"
              >Garantierte Mindestrente:</strong
            >
            {{
              quoteData()?.leistungsmerkmale?.garantierteMindestrente
                | currency : 'EUR'
            }}
          </span>
        </div>
      </div>
      }
    </div>
  </div>
</div>
